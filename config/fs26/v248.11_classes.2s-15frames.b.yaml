# model
model: model.SkateFormer.SkateFormer_
model_args:
  in_channels: 2
  num_classes: 11
  num_people: 1
  num_points: 12
  kernel_size: 7
  num_heads: 32
  attn_drop: 0.5
  head_drop: 0.0
  rel: True
  drop_path: 0.2
  type_1_size: [4, 3]
  type_2_size: [4, 4]
  type_3_size: [4, 3]
  type_4_size: [4, 4]
  mlp_ratio: 4.0
  index_t: True

# optim
optimizer: AdamW
weight_decay: 0.1
lr_scheduler: cosine
base_lr: 1e-4
min_lr: 1e-6
warmup_lr: 1e-7
warmup_prefix: False
warm_up_epoch: 3

# training
device: [0]
batch_size: 224
test_batch_size: 1024
num_epoch: 60
nesterov: True
grad_clip: True
grad_max: 1.0
loss_type: LSCE
